name: graduation-collector

# Continuous, read-only data collection for the memecoin event study (no keys, no trades).
# Each run collects for ~5.5 hours, saves the database to the rolling `data` branch, then starts the next run itself.
# The cron below is only a safety net in case the chain ever breaks. See docs/DEPLOY.md before enabling.
on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: "How long this run collects, in minutes (maximum 335)"
        default: "335"

concurrency:
  group: graduation-collector
  cancel-in-progress: false

permissions:
  contents: write   # push the rolling data branch
  actions: write    # start the next run

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      DATA_REMOTE: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Cost guard
        run: |
          private=$(gh api "repos/${{ github.repository }}" --jq .private)
          if [ "$private" = "true" ] && [ "${{ vars.ALLOW_PRIVATE_MINUTES }}" != "yes" ]; then
            echo "::error::This repository is private. A continuous collector uses roughly 43,000 Actions minutes per month, far above the free allowance."
            echo "::error::Make the repository public, or set the repository variable ALLOW_PRIVATE_MINUTES=yes if you accept the usage (and any charges)."
            exit 1
          fi
          echo "private=$private"

      - uses: actions/checkout@v4

      - name: Stop switch
        id: stop
        run: |
          set +e
          python3 bot/ci_persist.py stop
          rc=$?
          if [ "$rc" -eq 3 ]; then echo "stop=true" >> "$GITHUB_OUTPUT"; echo "STOP file found on the data branch: not collecting."; else echo "stop=false" >> "$GITHUB_OUTPUT"; fi

      - name: Tests
        if: steps.stop.outputs.stop != 'true'
        run: python3 -W ignore -m unittest discover -s bot -p "test_*.py"

      - name: Data sources reachable from this runner
        if: steps.stop.outputs.stop != 'true'
        working-directory: bot
        run: python3 -W ignore ci_smoke.py

      - name: Restore database from the data branch
        if: steps.stop.outputs.stop != 'true'
        run: python3 bot/ci_persist.py restore

      - name: Collect
        id: collect
        if: steps.stop.outputs.stop != 'true'
        run: |
          start=$(date +%s)
          echo "start=$start" >> "$GITHUB_OUTPUT"
          minutes="${{ inputs.minutes }}"; minutes="${minutes:-335}"
          [ "$minutes" -gt 335 ] && minutes=335
          ( while true; do sleep 7200; python3 bot/ci_persist.py persist || true; done ) &
          saver=$!
          cd bot
          timeout "${minutes}m" python3 -u -W ignore launches.py run > ../collector.log 2>&1 || true
          kill "$saver" 2>/dev/null || true

      - name: Save database to the data branch
        if: always() && steps.stop.outputs.stop != 'true'
        run: python3 bot/ci_persist.py persist

      - name: Summary
        if: always() && steps.stop.outputs.stop != 'true'
        working-directory: bot
        run: |
          { echo '### Collector'; echo '```'; python3 -W ignore launches.py stats; echo '```'; echo '```'; tail -n 5 ../collector.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Start the next run
        if: success() && steps.stop.outputs.stop != 'true'
        run: |
          elapsed=$(( $(date +%s) - ${{ steps.collect.outputs.start }} ))
          if [ "$elapsed" -lt 1800 ]; then echo "::warning::This run lasted under 30 minutes; not chaining (avoids a failure loop). The cron safety net will retry."; exit 0; fi
          gh workflow run collector.yml --ref "${{ github.ref_name }}"
