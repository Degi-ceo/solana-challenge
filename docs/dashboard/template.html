<meta name="claude:viewport-fit-sides" content="cover">
<title>Solana Paper Bot</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>
  /* Layout: sticky status bar + four tabs. Each tab is a single column on a phone and a two-column grid from 860px.
     One card style, one accent, status = dot/icon + word. */
  :root {
    --bg: #fcfcfb; --card: #ffffff; --ink: #0b0b0b; --ink2: #52514e; --ink3: #6b6a66; --line: #e6e5e0; --wash: #f4f3f0;
    --accent: #2a78d6; --accent-track: #cde2fb; --mute-bar: #8f8e87;
    --good: #0ca30c; --warn: #fab219; --bad: #d03b3b;
    --font: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg: #1a1a19; --card: #222221; --ink: #f0efec; --ink2: #c3c2b7; --ink3: #a2a196; --line: #383835; --wash: #2a2a28;
    --accent: #3987e5; --accent-track: #0d366b; --mute-bar: #6b6a64; color-scheme: dark; } }
  :root[data-theme="dark"] {
    --bg: #1a1a19; --card: #222221; --ink: #f0efec; --ink2: #c3c2b7; --ink3: #a2a196; --line: #383835; --wash: #2a2a28;
    --accent: #3987e5; --accent-track: #0d366b; --mute-bar: #6b6a64; color-scheme: dark; }

  * { box-sizing: border-box; }
  body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.5; margin: 0; }
  h1, h2, h3, p, ul, ol, dl, dd { margin: 0; padding: 0; }
  ul, ol { list-style: none; }
  .wrap { max-width: 1120px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .small { font-size: 13px; color: var(--ink2); }
  .eyebrow { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink3); font-weight: 500; }
  a { color: var(--accent); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

  /* ---- top bar ---- */
  .top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); border-bottom: 1px solid var(--line); }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); background: var(--bg); z-index: 30; }
  .top-in { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding-top: 12px; padding-bottom: 10px; }
  .brand { font-weight: 600; font-size: 16px; margin-right: auto; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px 8px; }
  .chip { display: inline-flex; align-items: center; gap: 7px; min-height: 28px; padding: 2px 11px; border: 1px solid var(--line); border-radius: 999px; font-size: 13px; background: var(--card); white-space: nowrap; }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--ink3); flex: none; }
  .dot.good { background: var(--good); } .dot.warn { background: var(--warn); } .dot.bad { background: var(--bad); }
  .tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; padding-bottom: 0; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { appearance: none; background: none; border: 0; border-bottom: 2px solid transparent; color: var(--ink2); font: inherit; font-weight: 500; padding: 10px 14px; min-height: 44px; cursor: pointer; white-space: nowrap; }
  .tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
  .tab:hover { color: var(--ink); }
  @media (max-width: 520px) { .tabs { gap: 0; } .tab { flex: 1 1 auto; padding: 10px 8px; font-size: 14px; } }

  main { padding-top: 24px; padding-bottom: 56px; }
  .panel[hidden] { display: none; }
  .stack { display: flex; flex-direction: column; gap: 20px; }
  .grid2 { display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; align-items: start; }
  @media (min-width: 860px) { .grid2 { grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); } .grid2.even { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
  .card h2 { font-size: 17px; font-weight: 600; line-height: 1.3; }
  .card h3 { font-size: 15px; font-weight: 600; }
  .head { display: flex; flex-direction: column; gap: 4px; }

  /* ---- right-now ---- */
  .now-title { font-size: 22px; font-weight: 600; line-height: 1.25; text-wrap: balance; }
  .needs { display: flex; flex-direction: column; gap: 10px; }
  .needs .big { font-size: 17px; font-weight: 600; }

  /* ---- meter ---- */
  .meter { height: 10px; border-radius: 5px; background: var(--accent-track); overflow: hidden; }
  .meter > i { display: block; height: 100%; background: var(--accent); border-radius: 5px; min-width: 2px; }
  .meter-row { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; color: var(--ink2); flex-wrap: wrap; }

  /* ---- figures ---- */
  .figs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  @media (min-width: 860px) { .figs { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
  .figs.five { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  @media (min-width: 900px) { .figs.five { grid-template-columns: repeat(5, minmax(0, 1fr)); } }
  .figs.five .fig:last-child { grid-column: 1 / -1; } @media (min-width: 900px) { .figs.five .fig:last-child { grid-column: auto; } }
  .fig { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .fig .v { font-size: 32px; font-weight: 600; line-height: 1.15; letter-spacing: -.01em; }
  .fig .l { font-size: 14px; font-weight: 500; }
  .fig .s { font-size: 13px; color: var(--ink2); }

  /* ---- criteria / lists ---- */
  .rows > li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 16px; padding: 12px 0; border-top: 1px solid var(--line); align-items: baseline; }
  .rows > li:first-child { border-top: 0; padding-top: 0; }
  .rows .nm { font-weight: 500; }
  .rows .ds { grid-column: 1; font-size: 13px; color: var(--ink2); }
  .rows .val { grid-column: 2; grid-row: 1; font-weight: 600; text-align: right; white-space: nowrap; }
  .rows .val small { font-weight: 400; color: var(--ink2); font-size: 13px; }

  .plan > li { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 2px 12px; padding: 12px 0; border-top: 1px solid var(--line); align-items: start; }
  .plan > li:first-child { border-top: 0; padding-top: 0; }
  .plan .ic { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 600; border: 1.5px solid var(--ink3); color: var(--ink2); }
  .plan .done .ic { background: var(--good); border-color: var(--good); color: #fff; }
  .plan .active .ic { border-color: var(--accent); color: var(--accent); background: var(--accent-track); }
  .plan .t { font-weight: 500; }
  .plan .n { font-size: 13px; color: var(--ink2); }
  .plan .st { font-size: 13px; color: var(--ink2); white-space: nowrap; }
  @media (max-width: 520px) { .plan > li { grid-template-columns: 28px minmax(0, 1fr); } .plan .st { grid-column: 2; } }

  /* ---- bars ---- */
  .bars { display: flex; flex-direction: column; gap: 12px; }
  .bar { display: grid; grid-template-columns: minmax(96px, 150px) minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; font-size: 14px; }
  .bar .trk { height: 16px; }
  .bar .fill { height: 100%; background: var(--accent); border-radius: 0 4px 4px 0; min-width: 2px; }
  .bar .fill.mute { background: var(--mute-bar); } .bar .fill.bad { background: var(--bad); }
  .bar .v { font-weight: 600; min-width: 3ch; text-align: right; }
  .bar .lb small { display: block; color: var(--ink2); font-size: 12px; line-height: 1.3; }
  @media (max-width: 520px) { .bar { grid-template-columns: minmax(0, 1fr) auto; } .bar .trk { grid-column: 1 / -1; grid-row: 2; } }

  details.tv { border-top: 1px solid var(--line); padding-top: 10px; }
  details.tv summary::before { content: "\25B8"; margin-right: 8px; font-size: 11px; }
  details.tv[open] summary::before { content: "\25BE"; }
  details.tv summary { cursor: pointer; font-size: 13px; color: var(--ink2); min-height: 28px; display: flex; align-items: center; }
  details.tv table { margin-top: 8px; }

  /* ---- tables that become cards on phones ---- */
  .scroll { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  th, td { text-align: left; padding: 10px 14px 10px 0; border-top: 1px solid var(--line); vertical-align: top; }
  th { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink3); font-weight: 500; border-top: 0; white-space: nowrap; }
  th button { all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; min-height: 28px; }
  th button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  td.r, th.r { text-align: right; }
  td.r.num { padding-right: 18px; } th.r { padding-right: 18px; }
  td.num { font-variant-numeric: tabular-nums; }
  @media (max-width: 640px) {
    table.cards thead { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
    table.cards, table.cards tbody { display: block; width: 100%; }
    table.cards tr { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px 16px; border-top: 1px solid var(--line); padding: 12px 0; }
    table.cards td { border: 0; padding: 0; display: block; text-align: left; min-width: 0; }
    table.cards td::before { content: attr(data-label); display: block; color: var(--ink2); font-size: 12px; }
    table.cards td:first-child, table.cards td:last-child { grid-column: 1 / -1; }
    table.cards td:first-child { font-weight: 600; } table.cards td:first-child::before { display: none; }
    table.cards td.r { text-align: left; padding-right: 0; }
  }

  .controls { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; }
  @media (min-width: 640px) { .controls { grid-template-columns: minmax(0, 2fr) repeat(3, minmax(0, 1fr)); } }
  .controls label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--ink2); }
  .controls input, .controls select { font: inherit; font-size: 15px; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 0 10px; min-height: 44px; width: 100%; }
  .btn { font: inherit; font-weight: 500; color: var(--ink); background: var(--wash); border: 1px solid var(--line); border-radius: 8px; min-height: 44px; padding: 0 16px; cursor: pointer; align-self: flex-start; }
  .btn:hover { border-color: var(--ink3); }

  .flow { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; counter-reset: s; }
  @media (min-width: 700px) { .flow { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  .flow > li { border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 6px; background: var(--card); }
  .flow .sn { font-size: 12px; color: var(--ink3); font-weight: 600; letter-spacing: .06em; }
  .flow .tag { margin-top: auto; padding-top: 4px; font-size: 13px; color: var(--ink2); display: flex; align-items: center; gap: 7px; }

  .timeline > li { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 2px 16px; padding: 14px 0; border-top: 1px solid var(--line); }
  .timeline > li:first-child { border-top: 0; padding-top: 0; }
  .timeline .when { font-size: 13px; color: var(--ink2); }
  @media (max-width: 560px) { .timeline > li { grid-template-columns: minmax(0, 1fr); } }
  .rows.stackv > li { grid-template-columns: minmax(0, 1fr); gap: 2px; }
  .rows.stackv .val { grid-column: 1; grid-row: auto; text-align: left; white-space: normal; font-size: 17px; }
  .rows.stackv .ds { font-size: 14px; }
  .finding { border-color: var(--warn); }
  .finding .head h2 { font-size: 20px; }
  .gates > li { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 2px 10px; padding: 10px 0; border-top: 1px solid var(--line); align-items: start; }
  .gates > li:first-child { border-top: 0; padding-top: 0; }
  .gi { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 700; border: 1.5px solid var(--ink3); color: var(--ink2); margin-top: 2px; }
  .gi.pass { background: var(--good); border-color: var(--good); color: #fff; } .gi.fail { background: var(--bad); border-color: var(--bad); color: #fff; }
  .gates .gt { font-weight: 500; } .gates .gd { font-size: 13px; color: var(--ink2); } .gates .gs { font-size: 13px; color: var(--ink2); white-space: nowrap; }
  @media (max-width: 520px) { .gates > li { grid-template-columns: 26px minmax(0, 1fr); } .gates .gs { grid-column: 2; } }
  .chartbox { position: relative; }
  .chartbox svg { display: block; width: 100%; height: auto; overflow: visible; }
  .chartbox svg text { fill: var(--ink2); font-size: 12px; font-family: var(--font); }
  .tip { position: absolute; pointer-events: none; z-index: 5; background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 13px; line-height: 1.4; box-shadow: 0 4px 16px rgba(0,0,0,.18); white-space: nowrap; }
  .tip b { font-weight: 600; }
  .kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
  .kv > div { border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 2px; }
  .kv .k { font-size: 13px; color: var(--ink2); } .kv .v { font-size: 22px; font-weight: 600; line-height: 1.2; } .kv .n { font-size: 12px; color: var(--ink2); }
  .callout { border-left: 3px solid var(--accent); background: var(--wash); border-radius: 0 8px 8px 0; padding: 12px 14px; font-size: 14px; }
  .csv { width: 100%; min-height: 110px; font: 12px/1.4 ui-monospace, Menlo, monospace; background: var(--wash); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 8px; }
  .row-actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
  dl.gl { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }
  @media (min-width: 760px) { dl.gl { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 28px; } }
  dl.gl dt { font-weight: 600; } dl.gl dd { font-size: 14px; color: var(--ink2); }
  .empty { border: 1px dashed var(--line); border-radius: 10px; padding: 16px; color: var(--ink2); font-size: 14px; }
  .stale { color: var(--ink); }
  @media (prefers-reduced-motion: no-preference) { .meter > i { transition: width .4s ease; } }
  @media print { .top { position: static; } .panel[hidden] { display: block; } }
</style>

<script type="application/json" id="snap">/*__DATA__*/</script>

<header class="top">
  <div class="wrap top-in">
    <span class="brand">Solana $5 · paper bot</span>
    <div class="chips" id="chips" role="status" aria-label="Safety state"></div>
  </div>
  <div class="wrap"><div class="tabs" role="tablist" aria-label="Sections" id="tabs"></div></div>
</header>

<main class="wrap">
  <section class="panel" id="p-overview" role="tabpanel" aria-labelledby="t-overview">
    <div class="stack">
      <div class="card finding" id="finding" hidden></div>
      <div class="grid2">
        <div class="card" id="now"></div>
        <div class="card needs" id="needs"></div>
      </div>
      <div class="figs five" id="figs"></div>
      <div class="grid2 even">
        <div class="stack"><div class="card" id="verdict"></div><div class="card" id="risk"></div></div>
        <div class="card" id="plan"></div>
      </div>
    </div>
  </section>

  <section class="panel" id="p-strategy" role="tabpanel" aria-labelledby="t-strategy" hidden>
    <div class="stack">
      <div class="card" id="prereg"></div>
      <div class="card" id="backtest"></div>
      <div class="card" id="trade"></div>
      <div class="grid2 even">
        <div class="card" id="rejects"></div>
        <div class="card" id="ready"></div>
      </div>
      <div class="card" id="watch"></div>
    </div>
  </section>

  <section class="panel" id="p-data" role="tabpanel" aria-labelledby="t-data" hidden>
    <div class="stack">
      <div class="grid2 even">
        <div class="card" id="coverage"></div>
        <div class="card" id="funnel"></div>
      </div>
      <div class="grid2 even">
        <div class="card" id="bands"></div>
        <div class="card" id="quality"></div>
      </div>
      <div class="card" id="stream"></div>
      <div class="card" id="srcmix"></div>
      <div class="card" id="explorer"></div>
    </div>
  </section>

  <section class="panel" id="p-rules" role="tabpanel" aria-labelledby="t-rules" hidden>
    <div class="stack">
      <div class="card" id="pipeline"></div>
      <div class="grid2 even" id="rulegroups"></div>
    </div>
  </section>

  <section class="panel" id="p-log" role="tabpanel" aria-labelledby="t-log" hidden>
    <div class="stack">
      <div class="card" id="sources"></div>
      <div class="card" id="journal"></div>
      <div class="card" id="glossary"></div>
      <div class="card" id="limits"></div>
    </div>
  </section>
</main>

<script>
(function () {
  var D = JSON.parse(document.getElementById('snap').textContent);
  var S = D.summary[0], pools = D.pools, cfg = {}, cfgRows = D.config;
  cfgRows.forEach(function (r) { cfg[r.key] = r.value; });
  var $ = function (id) { return document.getElementById(id); };
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; }
  function add(parent) { for (var i = 1; i < arguments.length; i++) if (arguments[i]) parent.appendChild(arguments[i]); return parent; }
  var fInt = new Intl.NumberFormat('en-US', { maximumFractionDigits: 0 });
  var money = function (v, d) { return (v < 0 ? '-' : '') + '$' + Math.abs(v).toFixed(d === undefined ? 2 : d); };
  var compact = function (v) { return v >= 1e9 ? '$' + (v / 1e9).toFixed(1) + 'B' : v >= 1e6 ? '$' + (v / 1e6).toFixed(1) + 'M' : v >= 1e3 ? '$' + Math.round(v / 1e3) + 'k' : '$' + Math.round(v); };
  function dot(kind) { return el('span', 'dot ' + (kind || '')); }
  function chip(kind, label) { var c = el('span', 'chip'); add(c, dot(kind), document.createTextNode(label)); return c; }
  function head(card, eyebrow, title, sub) {
    var h = el('div', 'head'); if (eyebrow) add(h, el('p', 'eyebrow', eyebrow)); add(h, el('h2', '', title)); if (sub) add(h, el('p', 'small', sub)); card.appendChild(h);
  }
  function meter(pct, label) {
    var m = el('div', 'meter'); m.setAttribute('role', 'progressbar'); m.setAttribute('aria-valuemin', '0'); m.setAttribute('aria-valuemax', '100');
    m.setAttribute('aria-valuenow', String(Math.round(pct))); m.setAttribute('aria-label', label);
    var i = el('i'); i.style.width = Math.max(0, Math.min(100, pct)) + '%'; m.appendChild(i); return m;
  }
  function tableView(cols, rows) {
    var d = el('details', 'tv'); add(d, el('summary', '', 'Table view'));
    var t = el('table'), th = el('thead'), tr = el('tr'); cols.forEach(function (c) { add(tr, el('th', '', c)); }); add(th, tr); add(t, th);
    var tb = el('tbody'); rows.forEach(function (r) { var x = el('tr'); r.forEach(function (c) { add(x, el('td', 'num', String(c))); }); add(tb, x); }); add(t, tb);
    add(d, add(el('div', 'scroll'), t)); return d;
  }

  /* ---------- derived numbers ---------- */
  var ageSec = Math.max(0, Date.now() / 1000 - S.updated_ts), ageMin = Math.round(ageSec / 60);
  var ageTxt = ageMin < 1 ? 'just now' : ageMin < 90 ? ageMin + ' min ago' : ageMin < 1440 ? Math.round(ageMin / 60) + ' h ago' : Math.round(ageMin / 1440) + ' d ago';
  var stale = ageSec > 2 * 3600;
  var elig = pools.filter(function (p) { return p.eligible; });
  var done = S.pools_downloaded, total = S.pools_eligible, pct = 100 * done / Math.max(1, total);
  var minAge = cfg.min_age_h / 24, maxAge = cfg.max_age_h / 24, floor = cfg.min_liq_usd;
  var inAge = elig.filter(function (p) { return p.age_days >= minAge && p.age_days <= maxAge; });
  var inLiq = inAge.filter(function (p) { return p.liq_now_usd >= floor; });
  var ready = inLiq.filter(function (p) { return p.downloaded; });
  var hist = D.history, eta = null;
  if (hist.length >= 2) {
    var a = hist[0], b = hist[hist.length - 1], dt = (b.ts - a.ts) / 60, dd = b.pools_done - a.pools_done;
    if (dt > 3 && dd > 0) eta = Math.round((total - b.pools_done) / (dd / dt));
  }
  var etaTxt = done >= total ? 'complete' : (!S.downloader_running ? 'download paused' : eta === null ? 'estimating time left' : eta < 2 ? 'under 2 min left' : eta < 90 ? 'about ' + eta + ' min left' : 'about ' + (eta / 60).toFixed(1) + ' h left');

  /* ---------- top bar ---------- */
  var chips = $('chips');
  add(chips, chip('good', 'Paper only'), chip(S.live_trading ? 'bad' : 'good', S.live_trading ? 'Live trading ON' : 'Live trading off'),
    chip(S.kill_file ? 'warn' : 'good', S.kill_file ? 'Kill switch on' : 'Kill switch off'),
    chip(stale ? 'warn' : '', 'Snapshot ' + ageTxt));

  /* ---------- tabs ---------- */
